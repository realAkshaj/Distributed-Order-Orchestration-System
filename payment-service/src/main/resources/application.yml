spring:
  config:
    import: classpath:common.yml
  application:
    name: payment-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      schema: ${DB_SCHEMA:payment_service}
      maximum-pool-size: ${HIKARI_POOL_SIZE:20}
  jpa:
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:payment_service}
  flyway:
    schemas: ${DB_SCHEMA:payment_service}
    default-schema: ${DB_SCHEMA:payment_service}
  kafka:
    consumer:
      properties:
        "[spring.json.value.default.type]": com.orderorchestration.common.messaging.SagaCommand

server:
  port: 8082
