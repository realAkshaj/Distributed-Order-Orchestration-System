x-service: &service
  environment: &service-env
    DATABASE_URL: jdbc:postgresql://postgres:5432/orders
    DATABASE_USER: postgres
    DATABASE_PASSWORD: postgres
    HIKARI_POOL_SIZE: ${HIKARI_POOL_SIZE:-8}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  restart: on-failure

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  orchestrator:
    <<: *service
    build: ./orchestrator
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
      DB_SCHEMA: orchestrator

  order-service:
    <<: *service
    build: ./order-service
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      DB_SCHEMA: order_service

  payment-service:
    <<: *service
    build: ./payment-service
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      DB_SCHEMA: payment_service

  inventory-service:
    <<: *service
    build: ./inventory-service
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
      DB_SCHEMA: inventory_service

  notification-service:
    <<: *service
    build: ./notification-service
    ports:
      - "8084:8084"
    environment:
      <<: *service-env
      DB_SCHEMA: notification_service

  dashboard:
    build: ./dashboard
    ports:
      - "3001:80"
    depends_on:
      - orchestrator

volumes:
  postgres-data:
