spring:
  application:
    name: order-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      schema: ${DB_SCHEMA:order_service}
      maximum-pool-size: ${HIKARI_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:order_service}
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
  flyway:
    schemas: ${DB_SCHEMA:order_service}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
